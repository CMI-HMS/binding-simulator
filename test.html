<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equilibrium binding simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E11;
    --panel:#12161B;
    --panel2:#171C22;
    --raised:#1B2129;
    --border:#232B33;
    --border-soft:#1A2028;
    --text:#E6EDF3;
    --muted:#7E8A99;
    --dim:#525E6B;
    --grid:#1E2731;
    --l1:#49D6C6;
    --l1-dim:#1E4A46;
    --l2:#F2A03D;
    --l2-dim:#4A3618;
    --l3:#C589F0;
    --l3-dim:#3A2A4A;
    --warn:#E8735F;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --disp:'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--mono);
    font-size:13px;
    line-height:1.5;
    padding:28px;
  }
  .app{max-width:1180px;margin:0 auto;}
  header{margin-bottom:22px;border-bottom:1px solid var(--border);padding-bottom:16px;}
  header h1{
    font-family:var(--disp);
    font-weight:600;
    font-size:24px;
    margin:0 0 4px 0;
    letter-spacing:-0.01em;
  }
  header .sub{color:var(--muted);font-size:12.5px;max-width:640px;}
  .layout{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start;}
  @media (max-width:880px){.layout{grid-template-columns:1fr;}}
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:16px;
  }
  .section-title{
    font-family:var(--disp);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.09em;
    color:var(--dim);
    margin:0 0 10px 0;
    font-weight:600;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:5px;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  input[type=number], input[type=text], select{
    width:100%;
    background:var(--raised);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--mono);
    font-size:13px;
    padding:7px 8px;
    border-radius:4px;
    outline:none;
  }
  input[type=number]:focus, input[type=text]:focus, select:focus{
    border-color:var(--dim);
  }
  input[type=number]::-webkit-inner-spin-button{opacity:0.5;}
  .unit-tag{
    display:inline-block;
    color:var(--dim);
    font-size:11px;
    margin-left:6px;
  }
  .mode-toggle{
    display:flex;
    background:var(--raised);
    border:1px solid var(--border);
    border-radius:4px;
    padding:3px;
    margin-bottom:16px;
  }
  .mode-toggle button{
    flex:1;
    background:transparent;
    border:none;
    color:var(--muted);
